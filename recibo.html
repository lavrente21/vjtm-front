<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo do Relatório — Livro de Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" style="max-width:1100px;margin:0 auto;padding:18px 16px 60px;">
  <div class="masthead">
    <div>
      <div class="title">Livro de Caixa</div>
      <div class="sub">Recibo público do relatório — só leitura</div>
    </div>
  </div>
  <div id="conteudo"><div class="empty">A carregar…</div></div>
</div>

<script>
// Troca isto pelo mesmo URL do backend usado no index.html principal.
const API_BASE_URL = 'https://SEU-BACKEND.onrender.com';

function fmt(n){ return Number(n||0).toLocaleString('pt-PT',{maximumFractionDigits:2}); }
function fmtTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }

function calcProduto(p){
  if(p.tipo==='saldo'){
    const reforcoTotal = (p.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
    const entrada = Number(p.entradaInformada||0) + reforcoTotal;
    p.resto = entrada - Number(p.vendaValor||0);
    p.entradaTotal = entrada;
    p.vendaTotalValor = Number(p.vendaValor||0);
    p.diferenca = (p.entradaEsperada!==null && p.entradaEsperada!==undefined) ? Number(p.entradaInformada||0) - Number(p.entradaEsperada||0) : 0;
  } else if(p.variantes && p.variantes.length){
    let entradaTotal=0, vendaTotalValor=0, restoTotal=0;
    p.variantes.forEach(v=>{
      const reforcoTotal = (v.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
      const entrada = Number(v.entradaInformada||0) + reforcoTotal;
      const qtdVendida = Number(v.qtdVendida||0);
      v.resto = entrada - qtdVendida;
      v.entradaTotal = entrada;
      v.valorVendido = qtdVendida * Number(v.denom||0);
      v.diferenca = (v.entradaEsperada!==null && v.entradaEsperada!==undefined) ? Number(v.entradaInformada||0) - Number(v.entradaEsperada||0) : 0;
      entradaTotal += entrada; vendaTotalValor += v.valorVendido; restoTotal += v.resto;
    });
    p.entradaTotal = entradaTotal; p.vendaTotalValor = vendaTotalValor; p.resto = restoTotal;
  } else {
    const reforcoTotal = (p.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
    const entrada = Number(p.entradaInformada||0) + reforcoTotal;
    const qtdVendida = (p.vendasLinhas||[]).reduce((a,l)=>a+Number(l.qtd||0),0);
    const valorVendido = (p.vendasLinhas||[]).reduce((a,l)=>a+Number(l.qtd||0)*Number(l.preco||0),0);
    p.resto = entrada - qtdVendida;
    p.entradaTotal = entrada;
    p.vendaTotalValor = valorVendido;
    p.diferenca = (p.entradaEsperada!==null && p.entradaEsperada!==undefined) ? Number(p.entradaInformada||0) - Number(p.entradaEsperada||0) : 0;
  }
}
function bfaEntregaStatus(rep){
  const bfa = rep.bfa||{}; const entrega = rep.entregaBfa||{};
  const aEntregar = Number(bfa.depositos||0) - Number(bfa.levantamentos||0);
  const totalEntregue = Number(entrega.cash||0)+Number(entrega.tpa||0)+Number(entrega.transferencia||0)+Number(entrega.depositoBanco||0);
  const diff = totalEntregue - aEntregar;
  return {aEntregar, totalEntregue, diff, estado: diff<0?'falta':diff>0?'mais':'ok'};
}
function vendasEntregaStatus(rep){
  const entrega = rep.entregaVendas||{};
  const aEntregar = totalVendidoRep(rep) - totalSaidasRep(rep);
  const totalEntregue = Number(entrega.cash||0)+Number(entrega.tpa||0)+Number(entrega.transferencia||0)+Number(entrega.depositoBanco||0);
  const diff = totalEntregue - aEntregar;
  return {aEntregar, totalEntregue, diff, estado: diff<0?'falta':diff>0?'mais':'ok'};
}
function totalVendidoRep(rep){ return rep.produtos.reduce((a,p)=>a+Number(p.vendaTotalValor||0),0); }
function totalSaidasRep(rep){ return (rep.saidas||[]).reduce((a,s)=>a+Number(s.valor||0),0); }
function stampSpan(estado, textos, diff){
  if(estado==='ok') return `<span class="stamp ok">${textos[0]}</span>`;
  if(estado==='falta') return `<span class="stamp falta">${textos[1]} — ${fmt(Math.abs(diff))} Kz</span>`;
  return `<span class="stamp mais">${textos[2]} — ${fmt(Math.abs(diff))} Kz</span>`;
}

async function carregar(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const el = document.getElementById('conteudo');
  if(!id){ el.innerHTML = '<div class="sheet"><div class="empty">Link inválido — falta o identificador do relatório.</div></div>'; return; }
  try{
    const res = await fetch(`${API_BASE_URL}/public/reports/${id}`);
    if(!res.ok){
      const d = await res.json().catch(()=>({}));
      el.innerHTML = `<div class="sheet"><div class="empty">${d.error || 'Não foi possível carregar este relatório.'}</div></div>`;
      return;
    }
    const rep = await res.json();
    el.innerHTML = renderRecibo(rep);
  }catch(e){
    el.innerHTML = '<div class="sheet"><div class="empty">Erro de ligação ao servidor. Tenta novamente.</div></div>';
  }
}

function renderRecibo(rep){
  rep.produtos.forEach(calcProduto);
  const bfaSt = bfaEntregaStatus(rep);
  const vendasSt = vendasEntregaStatus(rep);
  const totalVendido = totalVendidoRep(rep);
  const totalSaidas = totalSaidasRep(rep);
  const cont = rep.contabilidade || {bfa:{recebido:null,explicacaoFuncionario:null,depositado:null}, vendas:{recebido:null,explicacaoFuncionario:null,depositado:null}};

  const contBloco = (tipo, titulo)=>{
    const c = cont[tipo] || {recebido:null, explicacaoFuncionario:null, depositado:null};
    return `
      <div class="section-label">Contabilidade — ${titulo}</div>
      ${c.recebido ? `
        <div class="kv"><span>Recebido pela contabilidade</span><b>${fmt(c.recebido.valor)} Kz</b> ${c.recebido.estado==='pendencia'?'<span class="stamp falta">PENDÊNCIA</span>':'<span class="stamp ok">OK</span>'}</div>
        ${c.explicacaoFuncionario?`<div class="kv"><span>Explicação da loja</span><b>${c.explicacaoFuncionario}</b></div>`:''}
        <div class="kv" style="margin-top:8px;"><span>Depositado no banco</span><b>${c.depositado?fmt(c.depositado.valor)+' Kz · ref. '+c.depositado.referencia:'ainda não'}</b></div>
      ` : '<p class="muted">A contabilidade ainda não confirmou o recebimento.</p>'}
    `;
  };

  const rows = rep.produtos.map(p=>{
    if(p.variantes && p.variantes.length){
      return p.variantes.map(v=>`
        <tr>
          <td>${p.nome} <span class="badge">${v.denom}</span></td>
          <td class="num-cell">${fmt(v.entradaTotal)}</td>
          <td class="num-cell">${fmt(v.valorVendido)}</td>
          <td class="num-cell">${fmt(v.resto)}</td>
          <td>${(v.entradaEsperada==null)?'—':(v.diferenca===0?'<span class="stamp ok">OK</span>':v.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>')}</td>
        </tr>`).join('');
    }
    return `
      <tr>
        <td>${p.nome}</td>
        <td class="num-cell">${fmt(p.entradaTotal)}</td>
        <td class="num-cell">${fmt(p.vendaTotalValor)}</td>
        <td class="num-cell">${fmt(p.resto)}</td>
        <td>${p.entradaEsperada===null?'—':(p.diferenca===0?'<span class="stamp ok">OK</span>':p.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>')}</td>
      </tr>`;
  }).join('');

  return `
  <div class="sheet">
    <h2>Recibo do Relatório — ${rep.store}</h2>
    <p class="hint">${rep.date} · enviado por ${rep.enviadoPor||'—'} às ${fmtTime(rep.enviadoEm)}</p>

    <div class="section-label">Produtos</div>
    <div class="table-scroll"><table>
      <thead><tr><th>Produto</th><th>Entrada</th><th>Venda</th><th>Resto</th><th>Estado</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

    <div class="section-label">BFA</div>
    <div class="kv"><span>A entregar (Depósitos − Levantamentos)</span><b>${fmt(bfaSt.aEntregar)} Kz</b></div>
    <div class="kv"><span>Total entregue</span><b>${fmt(bfaSt.totalEntregue)} Kz</b></div>
    <div style="margin-top:8px;">${stampSpan(bfaSt.estado, ['CORRETO','EM FALTA','A MAIS'], bfaSt.diff)}</div>

    <div class="section-label">Vendas</div>
    <div class="kv"><span>A entregar (Total vendido − Saídas)</span><b>${fmt(vendasSt.aEntregar)} Kz</b></div>
    <div class="kv"><span>Total entregue</span><b>${fmt(vendasSt.totalEntregue)} Kz</b></div>
    <div style="margin-top:8px;">${stampSpan(vendasSt.estado, ['CORRETO','EM FALTA','A MAIS'], vendasSt.diff)}</div>

    <hr class="divider">
    <div class="kv"><span>Total vendido</span><b>${fmt(totalVendido)} Kz</b></div>
    <div class="kv"><span>Total de saídas</span><b>${fmt(totalSaidas)} Kz</b></div>
    ${rep.obs?`<div class="section-label">Observações</div><p>${rep.obs}</p>`:''}

    ${contBloco('bfa','BFA')}
    ${contBloco('vendas','Vendas')}
  </div>`;
}

carregar();
</script>
</body>
</html>
