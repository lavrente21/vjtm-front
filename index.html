<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro de Caixa — Sistema de Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   ESTADO GLOBAL
============================================================ */
const S = {
  users: [],
  catalog: [],
  session: null,        // {username, role, store}
  view: 'login',
  draftReport: null,     // relatório em edição
  selectedDate: todayStr(),
  selectedMonth: todayStr().slice(0,7),
  loaded: false,
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowIso(){ return new Date().toISOString(); }
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-PT',{maximumFractionDigits:2});
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }

/* ============================================================
   CLIENTE DA API (backend Render + Supabase)
   Troca este valor pelo URL do teu serviço no Render depois do deploy.
============================================================ */
const API_BASE_URL = 'https://SEU-BACKEND.onrender.com';

async function api(method, path, body){
  const headers = {'Content-Type':'application/json'};
  if(S.token) headers['Authorization'] = 'Bearer '+S.token;
  const res = await fetch(API_BASE_URL+path, {
    method, headers, body: body!==undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = (data && data.error) ? data.error : ('Erro '+res.status);
    if(res.status===401){ doLogout(); }
    throw new Error(msg);
  }
  return data;
}

/* ============================================================
   ACESSO A DADOS (via API)
============================================================ */
async function loadUsers(){
  try{ S.users = await api('GET','/users'); }catch(e){ S.users = []; }
}
async function loadCatalog(){
  try{ S.catalog = await api('GET','/catalog'); }catch(e){ S.catalog = []; }
}
async function getReport(date, store){
  try{ return await api('GET', `/reports/draft/${date}/${encodeURIComponent(store)}`); }
  catch(e){ return null; }
}
async function saveReport(rep){
  try{
    const saved = await api('PUT', `/reports/${rep.date}/${encodeURIComponent(rep.store)}`, {
      produtos: rep.produtos, saidas: rep.saidas, bfa: rep.bfa,
      entregaBfa: rep.entregaBfa, entregaVendas: rep.entregaVendas, obs: rep.obs,
    });
    rep.id = saved.id; // guarda o id devolvido pelo servidor, precisamos dele para pedidos de edição
    return saved;
  }catch(e){ toast(e.message); return null; }
}
async function listReportsForDate(date){
  try{ return await api('GET', `/reports/day/${date}`); }catch(e){ return []; }
}
async function listReportsForMonth(month){
  try{ return await api('GET', `/reports/month/${month}`); }catch(e){ return []; }
}
async function getLiveStock(store){
  try{
    const r = await api('GET', `/stock/${encodeURIComponent(store)}`);
    return r; // { store, base, linhas } — já vem pronto do servidor
  }catch(e){ return null; }
}

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  S.loaded = true;
  const savedSession = sessionStorage.getItem('ledger_session');
  const savedToken = sessionStorage.getItem('ledger_token');
  if(savedSession && savedToken){
    try{
      S.session = JSON.parse(savedSession);
      S.token = savedToken;
      S.view = S.session.role==='funcionario' ? 'novo-relatorio' : (S.session.role==='contabilista' ? 'contabilidade' : 'relatorios-dia');
      await loadCatalog();
    }catch(e){}
  }
  render();
}
boot();

/* ============================================================
   AUTH
============================================================ */
async function doLogin(username, password){
  try{
    const r = await api('POST', '/auth/login', {username, password});
    S.token = r.token;
    S.session = {username:r.user.username, role:r.user.role, store:r.user.store};
    sessionStorage.setItem('ledger_session', JSON.stringify(S.session));
    sessionStorage.setItem('ledger_token', S.token);
    if(r.user.mustChangePassword){ S.view='trocar-password'; render(); return; }
    await loadCatalog();
    S.view = r.user.role==='funcionario' ? 'novo-relatorio' : (r.user.role==='contabilista' ? 'contabilidade' : 'relatorios-dia');
    render();
  }catch(e){
    document.getElementById('login-err').textContent = e.message;
  }
}
function doLogout(){
  S.session=null; S.token=null;
  sessionStorage.removeItem('ledger_session'); sessionStorage.removeItem('ledger_token');
  S.view='login'; render();
}

/* ============================================================
   TOAST
============================================================ */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!S.loaded){ app.innerHTML = '<div class="empty">A carregar…</div>'; return; }
  if(!S.session){ app.innerHTML = viewLogin(); attachLoginHandlers(); return; }
  if(S.view==='trocar-password'){ app.innerHTML = viewTrocarPassword(); attachTrocarPasswordHandlers(); return; }

  app.innerHTML = viewShell();
  attachShellHandlers();
}

/* ============================================================
   VIEW: LOGIN
============================================================ */
function viewLogin(){
  return `
  <div class="login-wrap">
    <div class="brand">
      <div class="mark">Livro de Caixa</div>
      <div class="tag">Relatório diário · multi-loja · agente bancário BFA</div>
    </div>
    <div class="sheet">
      <h2>Entrar</h2>
      <p class="hint">Usa o utilizador e password da tua loja.</p>
      <div class="field-wrap">
        <label class="field">Utilizador</label>
        <input type="text" id="login-user" autocomplete="username">
      </div>
      <div class="field-wrap">
        <label class="field">Password</label>

      <button id="login-btn" style="width:100%;">Entrar</button>

function attachLoginHandlers(){
  const btn = document.getElementById('login-btn');
  const go = ()=>doLogin(document.getElementById('login-user').value.trim(), document.getElementById('login-pass').value);
  btn.onclick = go;
  document.getElementById('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ============================================================
   VIEW: TROCAR PASSWORD (primeiro acesso)
============================================================ */
function viewTrocarPassword(){
  return `
  <div class="login-wrap">
    <div class="sheet">
      <h2>Primeiro acesso — troca a tua password</h2>
      <p class="hint">Por segurança, define uma password nova antes de continuar.</p>
      <div class="field-wrap">
        <label class="field">Nova password</label>
        <input type="password" id="np1">
      </div>
      <div class="field-wrap">
        <label class="field">Confirmar nova password</label>
        <input type="password" id="np2">
      </div>
      <div id="np-err" style="color:var(--stamp-red);font-size:12.5px;margin-bottom:10px;"></div>
      <button id="np-btn" style="width:100%;">Guardar e continuar</button>
    </div>
  </div>`;
}
function attachTrocarPasswordHandlers(){
  document.getElementById('np-btn').onclick = async ()=>{
    const p1=document.getElementById('np1').value, p2=document.getElementById('np2').value;
    if(p1.length<4){ document.getElementById('np-err').textContent='A password deve ter pelo menos 4 caracteres.'; return; }
    if(p1!==p2){ document.getElementById('np-err').textContent='As passwords não coincidem.'; return; }
    try{
      await api('POST','/auth/change-password', {newPassword:p1});
      toast('Password atualizada.');
      await loadCatalog();
      S.view = S.session.role==='funcionario' ? 'novo-relatorio' : (S.session.role==='contabilista' ? 'contabilidade' : 'relatorios-dia');
      render();
    }catch(e){ document.getElementById('np-err').textContent = e.message; }
  };
}

/* ============================================================
   SHELL (header + tabs) por papel
============================================================ */
function tabsForRole(role){
  if(role==='funcionario') return [
    ['novo-relatorio','Novo Relatório'],
    ['meus-relatorios','Meus Relatórios'],
    ['stock','Stock'],
    ['catalogo','Catálogo de Produtos'],
  ];
  if(role==='contabilista') return [
    ['contabilidade','Contabilidade'],
  ];
  if(role==='supervisor') return [
    ['relatorios-dia','Relatórios do Dia'],
    ['pendentes','Pedidos Pendentes'],
    ['contabilidade','Contabilidade'],
    ['painel-bfa','Painel BFA'],
    ['stock','Stock'],
    ['resumo-mensal','Resumo Mensal'],
    ['catalogo','Catálogo de Produtos'],
  ];
  return [ // admin
    ['relatorios-dia','Relatórios do Dia'],
    ['pendentes','Pedidos Pendentes'],
    ['contabilidade','Contabilidade'],
    ['painel-bfa','Painel BFA'],
    ['stock','Stock'],
    ['resumo-mensal','Resumo Mensal'],
    ['catalogo','Catálogo de Produtos'],
    ['utilizadores','Utilizadores'],
  ];
}
const ROLE_LABELS = {admin:'ADM', supervisor:'Supervisor', funcionario:'Funcionário', contabilista:'Contabilista'};
function viewShell(){
  const tabs = tabsForRole(S.session.role);
  const roleLabel = ROLE_LABELS[S.session.role];
  let body='';
  if(S.view==='novo-relatorio') body = viewNovoRelatorio();
  else if(S.view==='meus-relatorios') body = viewMeusRelatorios();
  else if(S.view==='recibo') body = viewRecibo(S.reciboAtual);
  else if(S.view==='editar-final') body = viewEditarFinal();
  else if(S.view==='catalogo') body = viewCatalogo();
  else if(S.view==='relatorios-dia') body = viewRelatoriosDia();
  else if(S.view==='pendentes') body = viewPendentes();
  else if(S.view==='contabilidade') body = viewContabilidade();
  else if(S.view==='painel-bfa') body = viewPainelBFA();
  else if(S.view==='stock') body = viewStock();
  else if(S.view==='resumo-mensal') body = viewResumoMensal();
  else if(S.view==='utilizadores') body = viewUtilizadores();
  else body = '<div class="empty">Secção não encontrada.</div>';

  return `
    <div class="masthead">
      <div>
        <div class="title">Livro de Caixa</div>
        <div class="sub">Relatório diário · agente bancário BFA</div>
      </div>
      <div class="who">
        <span class="badge role-${S.session.role}">${roleLabel}</span>
        ${S.session.store? ` · <b>${S.session.store}</b>`:''} · <b>${S.session.username}</b><br>
        <span class="logout-link" id="logout-link">sair</span>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(([k,label])=>`<div class="tab ${S.view===k?'active':''}" data-tab="${k}">${label}</div>`).join('')}
    </div>
    <div id="tab-body">${body}</div>
  `;
}
function attachShellHandlers(){
  document.getElementById('logout-link').onclick = doLogout;
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ S.view = t.getAttribute('data-tab'); render(); };
  });
  attachViewHandlers();
}
function attachViewHandlers(){
  if(S.view==='novo-relatorio') attachNovoRelatorioHandlers();
  else if(S.view==='meus-relatorios') attachMeusRelatoriosHandlers();
  else if(S.view==='recibo') attachReciboHandlers();
  else if(S.view==='editar-final') attachEditarFinalHandlers();
  else if(S.view==='catalogo') attachCatalogoHandlers();
  else if(S.view==='relatorios-dia') attachRelatoriosDiaHandlers();
  else if(S.view==='pendentes') attachPendentesHandlers();
  else if(S.view==='contabilidade') attachContabilidadeHandlers();
  else if(S.view==='painel-bfa') attachPainelBFAHandlers();
  else if(S.view==='stock') attachStockHandlers();
  else if(S.view==='resumo-mensal') attachResumoMensalHandlers();
  else if(S.view==='utilizadores') attachUtilizadoresHandlers();
}

/* ============================================================
   CATÁLOGO DE PRODUTOS
============================================================ */
function viewCatalogo(){
  const filtro = (S.catalogoFiltro||'').trim().toLowerCase();
  const listaFiltrada = filtro ? S.catalog.filter(p=>p.name.toLowerCase().includes(filtro)) : S.catalog;
  const rows = listaFiltrada.map(p=>`
    <tr>
      <td>${p.name}${p.denominacoes && p.denominacoes.length?`<div class="small-note">Denominações: ${p.denominacoes.join(', ')}</div>`:''}</td>
      <td>${p.type==='saldo'?'Saldo / recarga':'Produto físico'}</td>
      <td>${p.unit}</td>
      <td>${p.naStores.includes(S.session.store)?'<span class="badge">não aplicável aqui</span>':''}</td>
      <td style="text-align:right;">
        ${S.session.role==='funcionario' ? `<button class="ghost small" data-toggle-na="${p.id}">${p.naStores.includes(S.session.store)?'Reativar para esta loja':'Marcar não aplicável aqui'}</button>` : `<button class="ghost small" data-remove="${p.id}">Remover</button>`}
      </td>
    </tr>`).join('');
  return `
  <div class="sheet">
    <h2>Catálogo de Produtos</h2>
    <p class="hint">Partilhado por todas as lojas. Qualquer utilizador pode adicionar um produto novo — passa a ficar disponível para todos.</p>
    <div class="field-wrap" style="max-width:280px;"><input type="text" id="catalogo-busca" placeholder="🔎 Pesquisar produto…" value="${S.catalogoFiltro||''}"></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Produto</th><th>Tipo</th><th>Unidade</th><th>Estado</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty">${filtro?'Nenhum produto encontrado.':'Sem produtos ainda.'}</td></tr>`}</tbody>
    </table></div>
    <hr class="divider">
    <div class="section-label">Adicionar produto novo</div>
    <div class="row3">
      <div class="field-wrap"><label class="field">Nome do produto</label><input type="text" id="np-name" placeholder="ex: Telemóvel"></div>
      <div class="field-wrap"><label class="field">Tipo</label>
        <select id="np-type">
          <option value="saldo">Saldo / recarga eletrónica (entrada/venda/resto em valor)</option>
          <option value="fisico">Produto físico (quantidade)</option>
        </select>
      </div>
      <div class="field-wrap"><label class="field">Unidade</label><input type="text" id="np-unit" placeholder="Kz, unidade, chip…" value="Kz"></div>
    </div>
    <div class="field-wrap"><label class="field">Denominações (só para produto físico tipo cartão — separadas por vírgula, ex: 200,500,1000). Deixa vazio se o preço variar por venda (ex: telemóvel).</label><input type="text" id="np-denom" placeholder="200,500,1000"></div>
    <button id="add-product-btn">Adicionar ao catálogo</button>
  </div>`;
}
function attachCatalogoHandlers(){
  const buscaEl = document.getElementById('catalogo-busca');
  if(buscaEl){
    buscaEl.oninput = ()=>{ S.catalogoFiltro = buscaEl.value; render(); };
    // mantém o foco no campo de busca depois do re-render
    buscaEl.focus();
    buscaEl.setSelectionRange(buscaEl.value.length, buscaEl.value.length);
  }
  const btn = document.getElementById('add-product-btn');
  if(btn) btn.onclick = async ()=>{
    const name = document.getElementById('np-name').value.trim();
    const type = document.getElementById('np-type').value;
    const unit = document.getElementById('np-unit').value.trim() || 'Kz';
    const denomRaw = document.getElementById('np-denom').value.trim();
    const denominacoes = denomRaw ? denomRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
    if(!name){ toast('Escreve o nome do produto.'); return; }
    try{
      await api('POST','/catalog', {name, type, unit, denominacoes: type==='fisico'?denominacoes:[]});
      toast('Produto adicionado ao catálogo.');
      await loadCatalog(); render();
    }catch(e){ toast(e.message); }
  };
  document.querySelectorAll('[data-toggle-na]').forEach(b=>{
    b.onclick = async ()=>{
      try{
        await api('PATCH', `/catalog/${b.getAttribute('data-toggle-na')}/toggle-na`, {store:S.session.store});
        await loadCatalog(); render();
      }catch(e){ toast(e.message); }
    };
  });
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Remover este produto do catálogo para todas as lojas?')) return;
      try{
        await api('DELETE', `/catalog/${b.getAttribute('data-remove')}`);
        await loadCatalog(); render();
      }catch(e){ toast(e.message); }
    };
  });
}

/* ============================================================
   NOVO RELATÓRIO (funcionário)
============================================================ */
async function ensureDraft(){
  if(S.draftReport && S.draftReport.date===S.selectedDate && S.draftReport.store===S.session.store) return;
  const store = S.session.store;
  const date = S.selectedDate;
  // O servidor já constrói o rascunho inicial (catálogo aplicável, os 2 turnos,
  // e o transporte do Resto do último relatório enviado), por isso basta pedir o "draft".
  S.draftReport = await getReport(date, store);
}
function calcProduto(p){
  if(p.tipo==='saldo'){
    const reforcoTotal = (p.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
    const entrada = Number(p.entradaInformada||0) + reforcoTotal;
    p.resto = entrada - Number(p.vendaValor||0);
    p.entradaTotal = entrada;
    p.vendaTotalValor = Number(p.vendaValor||0);
    p.diferenca = (p.entradaEsperada!==null && p.entradaEsperada!==undefined) ? Number(p.entradaInformada||0) - Number(p.entradaEsperada||0) : 0;
  } else if(p.variantes && p.variantes.length){
    let entradaTotal=0, vendaTotalValor=0, restoTotal=0, qtdVendidaTotal=0, diferencaTotal=0;
    p.variantes.forEach(v=>{
      const reforcoTotal = (v.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
      const entrada = Number(v.entradaInformada||0) + reforcoTotal;
      const qtdVendida = Number(v.qtdVendida||0);
      v.resto = entrada - qtdVendida;
      v.entradaTotal = entrada;
      v.valorVendido = qtdVendida * Number(v.denom||0);
      v.diferenca = (v.entradaEsperada!==null && v.entradaEsperada!==undefined) ? Number(v.entradaInformada||0) - Number(v.entradaEsperada||0) : 0;
      entradaTotal += entrada; vendaTotalValor += v.valorVendido; restoTotal += v.resto; qtdVendidaTotal += qtdVendida;
      diferencaTotal += v.diferenca;
    });
    p.entradaTotal = entradaTotal; p.vendaTotalValor = vendaTotalValor; p.resto = restoTotal;
    p.qtdVendida = qtdVendidaTotal; p.diferenca = diferencaTotal;
  } else {
    const reforcoTotal = (p.reforcos||[]).reduce((a,r)=>a+Number(r.valor||0),0);
    const entrada = Number(p.entradaInformada||0) + reforcoTotal;
    const qtdVendida = (p.vendasLinhas||[]).reduce((a,l)=>a+Number(l.qtd||0),0);
    const valorVendido = (p.vendasLinhas||[]).reduce((a,l)=>a+Number(l.qtd||0)*Number(l.preco||0),0);
    p.resto = entrada - qtdVendida;
    p.entradaTotal = entrada;
    p.qtdVendida = qtdVendida;
    p.vendaTotalValor = valorVendido;
    p.diferenca = (p.entradaEsperada!==null && p.entradaEsperada!==undefined) ? Number(p.entradaInformada||0) - Number(p.entradaEsperada||0) : 0;
  }
  return p;
}
function bfaEntregaStatus(data){
  const bfa = data.bfa || {};
  const entrega = data.entregaBfa || {};
  const aEntregar = Number(bfa.depositos||0) - Number(bfa.levantamentos||0);
  const totalEntregue = Number(entrega.cash||0)+Number(entrega.tpa||0)+Number(entrega.transferencia||0)+Number(entrega.depositoBanco||0);
  const diff = totalEntregue - aEntregar;
  let estado='ok';
  if(diff<0) estado='falta'; else if(diff>0) estado='mais';
  return {aEntregar, totalEntregue, diff, estado};
}
function vendasEntregaStatus(data){
  const entrega = data.entregaVendas || {};
  const aEntregar = totalVendidoRep(data) - totalSaidasRep(data);
  const totalEntregue = Number(entrega.cash||0)+Number(entrega.tpa||0)+Number(entrega.transferencia||0)+Number(entrega.depositoBanco||0);
  const diff = totalEntregue - aEntregar;
  let estado='ok';
  if(diff<0) estado='falta'; else if(diff>0) estado='mais';
  return {aEntregar, totalEntregue, diff, estado};
}
function totalVendidoRep(data){ return (data.produtos||[]).reduce((a,p)=>a+Number(p.vendaTotalValor||0),0); }
function totalSaidasRep(data){ return (data.saidas||[]).reduce((a,s)=>a+Number(s.valor||0),0); }

// Descobre qual turno está ativo (aberto) para edição, ou null se o dia já
// foi enviado (ambos os turnos fechados). S.formTarget aponta sempre para o
// objeto que o formulário está mesmo a editar — um turno, ou (pós-envio
// aprovado) o relatório do dia inteiro.
function getTurnoAtivo(rep){
  if(!rep.turnos) return null;
  const t1 = rep.turnos.find(t=>t.numero===1);
  const t2 = rep.turnos.find(t=>t.numero===2);
  if(t1.status==='aberto') return t1;
  if(t2.status==='aberto') return t2;
  return null;
}

function buildObsAuto(data){
  const linhas=[];
  (data.produtos||[]).forEach(p=>{
    if(p.variantes && p.variantes.length){
      p.variantes.forEach(v=>{
        if(v.entradaEsperada!==null && v.entradaEsperada!==undefined && v.diferenca!==0){
          linhas.push(`<div class="obs-auto ${v.diferenca>0?'mais':''}">⚠ ${p.nome} (${v.denom}): esperado ${fmt(v.entradaEsperada)}, informado ${fmt(v.entradaInformada)} → ${v.diferenca>0?'entrou a mais '+fmt(v.diferenca):'em falta '+fmt(Math.abs(v.diferenca))}</div>`);
        }
      });
    } else if(p.entradaEsperada!==null && p.entradaEsperada!==undefined && p.diferenca!==0){
      linhas.push(`<div class="obs-auto ${p.diferenca>0?'mais':''}">⚠ ${p.nome}: esperado ${fmt(p.entradaEsperada)}, informado ${fmt(p.entradaInformada)} → ${p.diferenca>0?'entrou a mais '+fmt(p.diferenca):'em falta '+fmt(Math.abs(p.diferenca))}</div>`);
    }
  });
  return linhas.join('');
}
function stampHtml(estado, textoOk, textoFalta, textoMais, diff){
  if(estado==='ok') return `<span class="stamp ok">${textoOk}</span>`;
  if(estado==='falta') return `<span class="stamp falta">${textoFalta} — ${fmt(Math.abs(diff))} Kz</span>`;
  return `<span class="stamp mais">${textoMais} — ${fmt(Math.abs(diff))} Kz</span>`;
}
// Recalcula tudo e atualiza só os elementos calculados no ecrã (por id), sem
// substituir o HTML todo — o campo onde a pessoa está a escrever nunca perde
// o foco nem a posição do cursor, tipo Excel. Opera sobre S.formTarget.
function updateComputedDisplays(){
  const data = S.formTarget;
  if(!data) return;
  data.produtos.forEach(calcProduto);
  data.produtos.forEach((p,i)=>{
    if(p.variantes && p.variantes.length){
      p.variantes.forEach((v,j)=>{
        const restoEl = document.getElementById(`resto-${i}-${j}`);
        if(restoEl) restoEl.textContent = fmt(v.resto);
        const diffEl = document.getElementById(`diff-${i}-${j}`);
        if(diffEl) diffEl.innerHTML = (v.entradaEsperada==null) ? '<span class="muted">— primeiro dia —</span>' :
          (v.diferenca===0?'<span class="stamp ok">BATE CERTO</span>':v.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>');
      });
    } else {
      const restoEl = document.getElementById(`resto-${i}`);
      if(restoEl) restoEl.textContent = fmt(p.resto);
      const diffEl = document.getElementById(`diff-${i}`);
      if(diffEl) diffEl.innerHTML = (p.entradaEsperada===null) ? '<span class="muted">— primeiro dia —</span>' :
        (p.diferenca===0?'<span class="stamp ok">BATE CERTO</span>':p.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>');
    }
  });
  const obsEl = document.getElementById('obs-auto-container');
  if(obsEl) obsEl.innerHTML = buildObsAuto(data);

  const bfaSt = bfaEntregaStatus(data);
  const vendasSt = vendasEntregaStatus(data);
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent = val; };
  set('calc-bfa-aentregar', fmt(bfaSt.aEntregar)+' Kz');
  set('calc-bfa-entregue', fmt(bfaSt.totalEntregue)+' Kz');
  set('calc-vendas-aentregar', fmt(vendasSt.aEntregar)+' Kz');
  set('calc-vendas-entregue', fmt(vendasSt.totalEntregue)+' Kz');
  const stampBfaEl = document.getElementById('stamp-bfa');
  if(stampBfaEl) stampBfaEl.innerHTML = stampHtml(bfaSt.estado,'BFA CORRETO','BFA EM FALTA','BFA A MAIS', bfaSt.diff);
  const stampVendasEl = document.getElementById('stamp-vendas');
  if(stampVendasEl) stampVendasEl.innerHTML = stampHtml(vendasSt.estado,'VENDAS CORRETO','VENDAS EM FALTA','VENDAS A MAIS', vendasSt.diff);
  set('calc-total-vendido', fmt(totalVendidoRep(data))+' Kz');
  set('calc-total-saidas', fmt(totalSaidasRep(data))+' Kz');
}

      <div class="field-wrap"><label class="field">Transferência</label><input type="number" id="ebfa-transferencia" value="${data.entregaBfa.transferencia}" ${locked?'disabled':''}></div>

async function saveTurno(rep, numero, data){
  try{
    const saved = await api('PUT', `/reports/${rep.date}/${encodeURIComponent(rep.store)}/turno/${numero}`, {
      produtos: data.produtos, saidas: data.saidas, bfa: data.bfa,
      entregaBfa: data.entregaBfa, entregaVendas: data.entregaVendas, obs: data.obs,
    });
    rep.id = saved.id;
    return saved;
  }catch(e){ toast(e.message); return null; }
}

function attachNovoRelatorioHandlers(){
  const verReciboBtn = document.getElementById('ver-recibo-dia');
  if(verReciboBtn) verReciboBtn.onclick = ()=>{ S.reciboAtual = S.draftReport; S.view='recibo'; render(); };

  const rep = S.draftReport;
  const data = S.formTarget;
  if(!data) return;

  document.querySelectorAll('input[data-p]').forEach(inp=>{
    inp.oninput = ()=>{
      const i = Number(inp.getAttribute('data-p')); const f = inp.getAttribute('data-f');
      data.produtos[i][f] = inp.value;
      updateComputedDisplays();
      persistDraftSilently();
    };
  });
  document.querySelectorAll('input[data-pv]').forEach(inp=>{
    inp.oninput = ()=>{
      const [i,j] = inp.getAttribute('data-pv').split('|').map(Number);
      const f = inp.getAttribute('data-f');
      data.produtos[i].variantes[j][f] = inp.value;
      updateComputedDisplays();
      persistDraftSilently();
    };
  });
  document.querySelectorAll('[data-reforco]').forEach(b=>{
    b.onclick = ()=> abrirReforcos(Number(b.getAttribute('data-reforco')), null);
  });
  document.querySelectorAll('[data-reforco-v]').forEach(b=>{
    const [i,j] = b.getAttribute('data-reforco-v').split('|').map(Number);
    b.onclick = ()=> abrirReforcos(i, j);
  });
  document.querySelectorAll('[data-linhas]').forEach(b=>{
    b.onclick = ()=>{
      const i = Number(b.getAttribute('data-linhas'));
      const p = data.produtos[i];
      const qtd = prompt('Quantidade vendida nesta linha:');
      if(qtd===null || qtd==='') return;
      const preco = prompt('Preço unitário desta linha (Kz):');
      if(preco===null || preco==='') return;
      p.vendasLinhas = p.vendasLinhas||[];
      p.vendasLinhas.push({qtd:Number(qtd), preco:Number(preco)});
      persistDraftSilently(); render();
    };
  });
  const addSaida = document.getElementById('add-saida');
  if(addSaida) addSaida.onclick = ()=>{ data.saidas.push({descricao:'',valor:0}); render(); };
  document.querySelectorAll('[data-saida]').forEach(inp=>{
    inp.oninput = ()=>{
      const i=Number(inp.getAttribute('data-saida')); const f=inp.getAttribute('data-f');
      data.saidas[i][f] = f==='valor'? Number(inp.value): inp.value;
      updateComputedDisplays();
      persistDraftSilently();
    };
  });
  document.querySelectorAll('[data-rm-saida]').forEach(b=>{
    b.onclick = ()=>{ data.saidas.splice(Number(b.getAttribute('data-rm-saida')),1); render(); };
  });
  ['depositos','levantamentos'].forEach(f=>{
    const el = document.getElementById('bfa-'+f);
    if(el) el.oninput = ()=>{ data.bfa[f]=Number(el.value); updateComputedDisplays(); persistDraftSilently(); };
  });
  ['cash','tpa','transferencia','depositoBanco'].forEach(f=>{
    const elB = document.getElementById('ebfa-'+f);
    if(elB) elB.oninput = ()=>{ data.entregaBfa[f]=Number(elB.value); updateComputedDisplays(); persistDraftSilently(); };
    const elV = document.getElementById('evendas-'+f);
    if(elV) elV.oninput = ()=>{ data.entregaVendas[f]=Number(elV.value); updateComputedDisplays(); persistDraftSilently(); };
  });
  const obsEl = document.getElementById('rep-obs');
  if(obsEl) obsEl.oninput = ()=>{ data.obs = obsEl.value; persistDraftSilently(); };

  const saveDraft = document.getElementById('save-draft');
  if(saveDraft) saveDraft.onclick = async ()=>{ await saveTurno(rep, data.numero, data); toast('Rascunho guardado.'); };

  const fecharBtn = document.getElementById('fechar-turno-btn');
  if(fecharBtn) fecharBtn.onclick = ()=>confirmarFecharTurno(rep, data);
}

function confirmarFecharTurno(rep, data){
  data.produtos.forEach(calcProduto);
  const bfaSt = bfaEntregaStatus(data);
  const vendasSt = vendasEntregaStatus(data);
  const txt = (s)=> s.estado==='ok'?'Correto':s.estado==='falta'?'Em falta '+fmt(Math.abs(s.diff))+' Kz':'A mais '+fmt(Math.abs(s.diff))+' Kz';
  const acao = data.numero===1 ? 'Fechar o Turno 1?' : 'Fechar o Turno 2 e ENVIAR o relatório final do dia?';
  const msg = `${acao}\n\nTotal vendido no turno: ${fmt(totalVendidoRep(data))} Kz\nBFA: ${txt(bfaSt)}\nVendas: ${txt(vendasSt)}\n\n${data.numero===2 ? 'Depois disto, o relatório do dia inteiro é enviado ao chefe e ao WhatsApp.' : 'Depois disto, o Turno 2 pode começar.'}`;
  if(!confirm(msg)) return;
  fecharTurnoAgora(rep, data.numero);
}
async function fecharTurnoAgora(rep, numero){
  await saveTurno(rep, numero, S.formTarget);
  try{
    const atualizado = await api('POST', `/reports/${rep.date}/${encodeURIComponent(rep.store)}/turno/${numero}/fechar`);
    toast(numero===1 ? 'Turno 1 fechado. Pronto para o Turno 2.' : 'Turno 2 fechado — relatório final enviado.');
    S.draftReport = atualizado;
    if(numero===2){
      S.reciboAtual = atualizado;
      S.view = 'recibo';
    }
    render();
  }catch(e){ toast(e.message); }
}

function renderInPlaceBfa(){ /* recalculo simples via re-render completo é suficiente */ }
function getReforcoArray(i,j){
  const p = S.formTarget.produtos[i];
  return j===null ? (p.reforcos = p.reforcos||[]) : (p.variantes[j].reforcos = p.variantes[j].reforcos||[]);
}
function abrirReforcos(i, j){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Reforços</h3>
      <div id="reforco-list"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input type="number" id="reforco-novo-valor" placeholder="Valor/quantidade" style="flex:1;">
        <button class="small" id="reforco-add-btn">Adicionar</button>
      </div>
      <div style="margin-top:14px;text-align:right;"><button class="ghost small" id="reforco-fechar">Fechar</button></div>
    </div>`;
  document.body.appendChild(overlay);

  function renderLista(){
    const arr = getReforcoArray(i,j);
    document.getElementById('reforco-list').innerHTML = arr.length ? arr.map((r,idx)=>`
      <div class="reforco-row">
        <span class="hora">${fmtTime(r.hora)}</span>
        <input type="number" value="${r.valor}" data-ridx="${idx}">
        <button class="ghost small" data-rmreforco="${idx}">remover</button>
      </div>`).join('') : '<p class="muted small-note">Sem reforços ainda.</p>';

    document.querySelectorAll('#reforco-list input[data-ridx]').forEach(inp=>{
      inp.oninput = ()=>{
        arr[Number(inp.getAttribute('data-ridx'))].valor = Number(inp.value);
        updateComputedDisplays(); persistDraftSilently();
      };
    });
    document.querySelectorAll('[data-rmreforco]').forEach(b=>{
      b.onclick = ()=>{
        arr.splice(Number(b.getAttribute('data-rmreforco')),1);
        updateComputedDisplays(); persistDraftSilently();
        renderLista();
      };
    });
  }
  renderLista();

  document.getElementById('reforco-add-btn').onclick = ()=>{
    const val = document.getElementById('reforco-novo-valor').value;
    if(val===''){ return; }
    const arr = getReforcoArray(i,j);
    arr.push({valor:Number(val), hora:nowIso()});
    document.getElementById('reforco-novo-valor').value='';
    updateComputedDisplays(); persistDraftSilently();
    renderLista();
  };
  document.getElementById('reforco-fechar').onclick = ()=>{ overlay.remove(); render(); };
}
let _persistTimer = null;
function persistDraftSilently(){
  if(_persistTimer) clearTimeout(_persistTimer);
  _persistTimer = setTimeout(()=>{ saveTurno(S.draftReport, S.formTarget.numero, S.formTarget); }, 400);
}

function viewRecibo(rep){

  const totalSaidas = totalSaidasRep(rep);
  const cont = rep.contabilidade || {bfa:{recebido:null,explicacaoFuncionario:null,depositado:null}, vendas:{recebido:null,explicacaoFuncionario:null,depositado:null}};

    const c = cont[tipo] || {recebido:null,explicacaoFuncionario:null,depositado:null};
    return `
      <div class="section-label">Contabilidade — ${titulo}</div>
      ${c.recebido ? `
        <div class="kv"><span>Recebido pela contabilidade</span><b>${fmt(c.recebido.valor)} Kz</b> ${c.recebido.estado==='pendencia'?'<span class="stamp falta">PENDÊNCIA</span>':'<span class="stamp ok">OK</span>'}</div>
        ${c.recebido.estado==='pendencia' ? `
          <div class="banner falta">⚠ Diferença de ${fmt(Math.abs(c.recebido.diferenca))} Kz (${c.recebido.diferenca>0?'entregou a mais':'entregou a menos'}). Por favor explica abaixo.</div>
          ${c.explicacaoFuncionario ? `<div class="kv"><span>Explicação enviada</span><b>${c.explicacaoFuncionario}</b></div>` :
            (S.session.role==='funcionario' ? `
              <div class="field-wrap"><label class="field">Explica a diferença (${titulo})</label><textarea id="explicacao-${tipo}" rows="2"></textarea></div>
              <button class="secondary small" data-salvar-explicacao="${tipo}">Guardar explicação</button>
            ` : '<p class="muted small-note">Aguardando explicação da loja.</p>')}
        ` : ''}
        <div class="kv" style="margin-top:8px;"><span>Depositado no banco</span><b>${c.depositado?fmt(c.depositado.valor)+' Kz · ref. '+c.depositado.referencia:'ainda não'}</b></div>
      ` : '<p class="muted">A contabilidade ainda não confirmou o recebimento.</p>'}
    `;
  };
  const minutosDesde = (iso)=> iso ? Math.floor((Date.now()-new Date(iso).getTime())/60000) : 999999;
  const pedidoAprovadoAtivo = (rep.pedidosEdicao||[]).find(p=>p.status==='aprovado' && minutosDesde(p.aprovadoEm)<15);
  const contConfirmada = !!((cont.bfa&&cont.bfa.recebido) || (cont.vendas&&cont.vendas.recebido));
  const dentroJanelaLivre = !contConfirmada && minutosDesde(rep.enviadoEm) < 15;
  const podeEditar = dentroJanelaLivre || !!pedidoAprovadoAtivo;
  const pedidoPendente = (rep.pedidosEdicao||[]).find(p=>p.status==='pendente');

  const blocoEdicao = (S.session.role!=='funcionario') ? '' : contConfirmada ? '' : `
    <div class="section-label">Editar este relatório</div>
    ${podeEditar ? `
      <div class="banner ok">${dentroJanelaLivre?'Ainda estás dentro dos 15 min livres para corrigir.':'Edição aprovada — tens mais 15 min.'}</div>
      <button class="secondary small" id="editar-final-btn">Editar relatório</button>
    ` : pedidoPendente ? `
      <div class="banner mais">Pedido de edição enviado às ${fmtTime(pedidoPendente.pedidoEm)} — aguardando aprovação do Supervisor/ADM.</div>
    ` : `
      <div class="banner falta">A janela de edição livre já passou. Pede autorização ao Supervisor/ADM para corrigir.</div>
      <div class="field-wrap"><label class="field">Motivo do pedido</label><textarea id="motivo-pedido-recibo" rows="2"></textarea></div>
      <button class="secondary small" id="pedir-edicao-recibo-btn">Pedir autorização para editar</button>
    `}
  `;

  return `
  <div class="sheet">
    <h2>Recibo do Relatório — ${rep.store}</h2>
    <p class="hint">${rep.date} · enviado por ${rep.enviadoPor||'—'} às ${fmtTime(rep.enviadoEm)}</p>
    <div class="section-label">Produtos</div>
    <div class="table-scroll"><table>
      <thead><tr><th>Produto</th><th>Entrada</th><th>Venda</th><th>Resto</th><th>Estado</th></tr></thead>
      <tbody>
        ${rep.produtos.map(p=>{
          if(p.variantes && p.variantes.length){
            return p.variantes.map(v=>`
              <tr>
                <td>${p.nome} <span class="badge">${v.denom}</span></td>
                <td class="num-cell">${fmt(v.entradaTotal)}</td>
                <td class="num-cell">${fmt(v.valorVendido)}</td>
                <td class="num-cell">${fmt(v.resto)}</td>
                <td>${(v.entradaEsperada===null||v.entradaEsperada===undefined)?'—':(v.diferenca===0?'<span class="stamp ok">OK</span>':v.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>')}</td>
              </tr>`).join('');
          }
          return `
          <tr>
            <td>${p.nome}</td>
            <td class="num-cell">${fmt(p.entradaTotal)}</td>
            <td class="num-cell">${fmt(p.vendaTotalValor)}</td>
            <td class="num-cell">${fmt(p.resto)}</td>
            <td>${p.entradaEsperada===null?'—':(p.diferenca===0?'<span class="stamp ok">OK</span>':p.diferenca>0?'<span class="stamp mais">A MAIS</span>':'<span class="stamp falta">EM FALTA</span>')}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>

    <div class="section-label">BFA</div>
    <div class="kv"><span>A entregar (Depósitos − Levantamentos)</span><b>${fmt(bfaSt.aEntregar)} Kz</b></div>
    <div class="kv"><span>Total entregue</span><b>${fmt(bfaSt.totalEntregue)} Kz</b></div>
    <div style="margin-top:8px;">${bfaSt.estado==='ok'?'<span class="stamp ok">CORRETO</span>':bfaSt.estado==='falta'?`<span class="stamp falta">EM FALTA ${fmt(Math.abs(bfaSt.diff))} Kz</span>`:`<span class="stamp mais">A MAIS ${fmt(Math.abs(bfaSt.diff))} Kz</span>`}</div>

    <div class="section-label">Vendas</div>
    <div class="kv"><span>A entregar (Total vendido − Saídas)</span><b>${fmt(vendasSt.aEntregar)} Kz</b></div>
    <div class="kv"><span>Total entregue</span><b>${fmt(vendasSt.totalEntregue)} Kz</b></div>
    <div style="margin-top:8px;">${vendasSt.estado==='ok'?'<span class="stamp ok">CORRETO</span>':vendasSt.estado==='falta'?`<span class="stamp falta">EM FALTA ${fmt(Math.abs(vendasSt.diff))} Kz</span>`:`<span class="stamp mais">A MAIS ${fmt(Math.abs(vendasSt.diff))} Kz</span>`}</div>

function viewRelatoriosDia(){
  return `
  <div class="sheet">
    <h2>Relatórios do Dia</h2>

async function loadRelatoriosDia(){
  const date = document.getElementById('rd-date').value;
  S.selectedDate = date;
  await loadUsers();
  const reps = await listReportsForDate(date);
  const lojas = S.users.filter(u=>u.role==='funcionario').map(u=>u.store);
  const lojasComRelatorio = reps.map(r=>r.store);
  const faltando = lojas.filter(l=>!lojasComRelatorio.includes(l));

  let totalGeral=0, totalSaidasGeral=0;
  reps.forEach(rep=>{
    rep.produtos.forEach(calcProduto);

    const totalVendido = totalVendidoRep(rep);
    const totalSaidas = totalSaidasRep(rep);
    totalGeral += totalVendido; totalSaidasGeral += totalSaidas;
    const selo = (s,nome)=> s.estado==='ok'?`<span class="stamp ok">${nome} OK</span>`:s.estado==='falta'?`<span class="stamp falta">${nome} FALTA</span>`:`<span class="stamp mais">${nome} A MAIS</span>`;
    html += `
      <div class="store-card">
        <div class="head">
          <span class="name">${rep.store}</span>
          <span>${selo(bfaSt,'BFA')} ${selo(vendasSt,'VENDAS')}</span>
        </div>
        <div class="kv"><span>Total vendido</span><b>${fmt(totalVendido)} Kz</b></div>
        <div class="kv"><span>Total de saídas</span><b>${fmt(totalSaidas)} Kz</b></div>
        <div class="kv"><span>Status</span><b>${rep.status==='enviado'?'Enviado':'Rascunho'}</b></div>
        <button class="ghost small" data-ver-recibo="${rep.store}">Ver recibo completo</button>
      </div>`;
  });
  if(reps.length){
    html += `<div class="banner ok">Total geral do dia: ${fmt(totalGeral)} Kz vendidos · ${fmt(totalSaidasGeral)} Kz em saídas.</div>`;

    html += '<div class="empty">Sem lojas registadas ainda.</div>';
  }
  document.getElementById('rd-body').innerHTML = html || '<div class="empty">Sem dados.</div>';
  document.querySelectorAll('[data-ver-recibo]').forEach(b=>{
    b.onclick = async ()=>{
      const rep = reps.find(r=>r.store===b.getAttribute('data-ver-recibo'));
      S.reciboAtual = rep; S.view='recibo'; render();
    };
  });
}
function attachRelatoriosDiaHandlers(){
  document.getElementById('rd-date').onchange = loadRelatoriosDia;

}

/* ============================================================
   PEDIDOS PENDENTES (supervisor/admin)
============================================================ */
function viewPendentes(){
  return `<div class="sheet"><h2>Pedidos de Edição Pendentes</h2><div id="pend-body" class="empty">A carregar…</div></div>`;
}
async function loadPendentes(){
  // varre os últimos 45 dias por simplicidade
  const hoje = new Date();
  let html=''; let achou=false;
  for(let i=0;i<45;i++){
    const d = new Date(hoje); d.setDate(d.getDate()-i);
    const dateStr = d.toISOString().slice(0,10);
    const reps = await listReportsForDate(dateStr);
    for(const rep of reps){
      const pend = (rep.pedidosEdicao||[]).filter(p=>p.status==='pendente');
      for(const p of pend){
        achou=true;
        const expirado = (Date.now()-new Date(p.pedidoEm).getTime()) > 24*3600*1000;
        html += `
        <div class="store-card">
          <div class="head"><span class="name">${rep.store} — ${rep.date}</span>${expirado?'<span class="badge">expirado (24h)</span>':''}</div>
          <div class="kv"><span>Motivo</span><b>${p.motivo}</b></div>
          <div class="kv"><span>Pedido por</span><b>${p.pedidoPor}</b></div>
          <div class="kv"><span>Às</span><b>${fmtTime(p.pedidoEm)} · ${p.pedidoEm.slice(0,10)}</b></div>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button class="small" data-aprovar="${rep.id}|${p.id}" ${expirado?'disabled':''}>Aprovar</button>
            <button class="ghost small" data-rejeitar="${rep.id}|${p.id}">Rejeitar</button>
          </div>
        </div>`;
      }
    }
  }
  document.getElementById('pend-body').innerHTML = achou ? html : '<div class="empty">Sem pedidos pendentes.</div>';
  document.querySelectorAll('[data-aprovar]').forEach(b=>{
    b.onclick = async ()=>{
      const [reportId, reqId] = b.getAttribute('data-aprovar').split('|');
      try{
        await api('POST', `/reports/${reportId}/edit-requests/${reqId}/approve`);
        toast('Pedido aprovado. A loja tem mais 15 min para editar.');
      }catch(e){ toast(e.message); }
      loadPendentes();
    };
  });
  document.querySelectorAll('[data-rejeitar]').forEach(b=>{
    b.onclick = async ()=>{
      const [reportId, reqId] = b.getAttribute('data-rejeitar').split('|');
      try{
        await api('POST', `/reports/${reportId}/edit-requests/${reqId}/reject`);
        toast('Pedido rejeitado.');
      }catch(e){ toast(e.message); }
      loadPendentes();
    };
  });
}
function attachPendentesHandlers(){ loadPendentes(); }

/* ============================================================
   CONTABILIDADE
   - Contabilista: confirma recebimento (loja a loja, conforme cada
     uma fecha o dia) e depois confirma o depósito no banco.
   - Se o valor recebido não bater com o Total Geral a Entregar do
     relatório, fica registado como pendência e a loja é notificada
     (vê no próprio recibo) para explicar a diferença.
   - Supervisor/ADM veem tudo em modo leitura, com alerta se o
     dinheiro ficar recebido há mais de 24h sem depósito confirmado.
============================================================ */
function viewContabilidade(){
  return `<div class="sheet"><h2>Contabilidade</h2><div id="cont-body" class="empty">A carregar…</div></div>`;
}
async function loadContabilidade(){
  const isContabilista = S.session.role==='contabilista';
  let reps = [];
  try{ reps = await api('GET', '/contabilidade/pendentes?dias=45'); }catch(e){ toast(e.message); }

  function secao(tipo, titulo){
    let receberHtml='', depositarHtml='', dashboardHtml='';
    reps.forEach(rep=>{
      const geral = tipo==='bfa' ? rep.geralBfa : rep.geralVendas;
      const c = (rep.contabilidade && rep.contabilidade[tipo]) || {recebido:null, explicacaoFuncionario:null, depositado:null};

      if(isContabilista && !c.recebido){
        receberHtml += `
        <div class="store-card">
          <div class="head"><span class="name">${rep.store} — ${rep.date}</span></div>
          <div class="kv"><span>A entregar (${titulo})</span><b>${fmt(geral.aEntregar)} Kz</b></div>
          <div class="field-wrap"><label class="field">Valor recebido do funcionário</label>
            <input type="number" id="recv-${tipo}-${rep.id}" value="${geral.aEntregar}"></div>
          <button class="small" data-confirmar-recebimento="${tipo}|${rep.id}">Confirmar recebimento</button>
        </div>`;
      }
      if(isContabilista && c.recebido && !c.depositado){
        const horas = Math.floor((Date.now()-new Date(c.recebido.em).getTime())/3600000);
        depositarHtml += `
        <div class="store-card">
          <div class="head"><span class="name">${rep.store} — ${rep.date}</span>${horas>24?`<span class="badge">aguardando depósito há ${horas}h</span>`:''}</div>
          <div class="kv"><span>Recebido</span><b>${fmt(c.recebido.valor)} Kz</b> ${c.recebido.estado==='pendencia'?'<span class="stamp falta">PENDÊNCIA</span>':'<span class="stamp ok">OK</span>'}</div>
          <div class="row2">
            <div class="field-wrap"><label class="field">Valor depositado no banco</label><input type="number" id="dep-valor-${tipo}-${rep.id}" value="${c.recebido.valor}"></div>
            <div class="field-wrap"><label class="field">Referência do depósito</label><input type="text" id="dep-ref-${tipo}-${rep.id}" placeholder="ex: talão nº..."></div>
          </div>
          <button class="small" data-confirmar-deposito="${tipo}|${rep.id}">Confirmar depósito</button>
        </div>`;
      }
      if(!isContabilista){
        const horas = (c.recebido && !c.depositado) ? Math.floor((Date.now()-new Date(c.recebido.em).getTime())/3600000) : null;
        dashboardHtml += `
        <div class="store-card">
          <div class="head"><span class="name">${rep.store} — ${rep.date}</span></div>
          <div class="kv"><span>A entregar (${titulo})</span><b>${fmt(geral.aEntregar)} Kz</b></div>
          <div class="kv"><span>Recebido pela contabilidade</span><b>${c.recebido?fmt(c.recebido.valor)+' Kz':'— ainda não'}</b> ${c.recebido?(c.recebido.estado==='pendencia'?'<span class="stamp falta">PENDÊNCIA</span>':'<span class="stamp ok">OK</span>'):''}</div>
          ${c.explicacaoFuncionario?`<div class="kv"><span>Explicação da loja</span><b>${c.explicacaoFuncionario}</b></div>`:''}
          <div class="kv"><span>Depositado no banco</span><b>${c.depositado?fmt(c.depositado.valor)+' Kz · ref. '+c.depositado.referencia:'— ainda não'}</b></div>
          ${horas!==null && horas>24?`<div class="banner falta">⚠ Recebido há ${horas}h sem depósito confirmado.</div>`:''}
        </div>`;
      }
    });
    if(isContabilista){
      return `<div class="section-label">${titulo} — Por receber</div>${receberHtml || '<div class="empty">Sem relatórios à espera de recebimento.</div>'}
              <div class="section-label">${titulo} — Recebido, aguardando depósito</div>${depositarHtml || '<div class="empty">Nada à espera de depósito.</div>'}`;
    }
    return `<div class="section-label">${titulo}</div>${dashboardHtml || '<div class="empty">Sem relatórios enviados nos últimos 45 dias.</div>'}`;
  }

  document.getElementById('cont-body').innerHTML = secao('bfa','BFA') + secao('vendas','Vendas');

  document.querySelectorAll('[data-confirmar-recebimento]').forEach(b=>{
    b.onclick = async ()=>{
      const [tipo, id] = b.getAttribute('data-confirmar-recebimento').split('|');
      const valor = Number(document.getElementById(`recv-${tipo}-${id}`).value);
      try{
        const saved = await api('POST', `/contabilidade/${id}/recebimento`, {tipo, valor});
        const diferenca = saved.contabilidade[tipo].recebido.diferenca;
        toast(diferenca===0 ? 'Recebimento confirmado — bate certo.' : 'Registado como pendência: a loja foi notificada para explicar.');
      }catch(e){ toast(e.message); }
      loadContabilidade();
    };
  });
  document.querySelectorAll('[data-confirmar-deposito]').forEach(b=>{
    b.onclick = async ()=>{
      const [tipo, id] = b.getAttribute('data-confirmar-deposito').split('|');
      const valor = Number(document.getElementById(`dep-valor-${tipo}-${id}`).value);
      const referencia = document.getElementById(`dep-ref-${tipo}-${id}`).value.trim();
      try{
        await api('POST', `/contabilidade/${id}/deposito`, {tipo, valor, referencia});
        toast('Depósito confirmado.');
      }catch(e){ toast(e.message); }
      loadContabilidade();
    };
  });
}
function attachContabilidadeHandlers(){ loadContabilidade(); }


/* ============================================================
   PAINEL BFA (supervisor/admin) — visão dedicada ao agente bancário
============================================================ */
function viewPainelBFA(){
  return `
  <div class="sheet">
    <h2>Painel BFA — Agente Bancário</h2>
    <div class="field-wrap" style="max-width:220px;"><label class="field">Data</label><input type="date" id="pbfa-date" value="${S.selectedDate}"></div>
    <div id="pbfa-body" class="empty">A carregar…</div>
  </div>`;
}
async function loadPainelBFA(){
  const date = document.getElementById('pbfa-date').value;
  S.selectedDate = date;
  const reps = await listReportsForDate(date);
  if(!reps.length){ document.getElementById('pbfa-body').innerHTML = '<div class="empty">Sem relatórios nesta data.</div>'; return; }
  let totDep=0, totLev=0, totDif=0;
  const rows = reps.map(rep=>{
    const bfa = bfaEntregaStatus(rep);
    totDep+=Number(rep.bfa.depositos||0); totLev+=Number(rep.bfa.levantamentos||0); totDif+=bfa.aEntregar;
    const cont = rep.contabilidade||{};
    return `
    <tr>
      <td>${rep.store}</td>
      <td class="num-cell">${fmt(rep.bfa.depositos)}</td>
      <td class="num-cell">${fmt(rep.bfa.levantamentos)}</td>
      <td class="num-cell">${fmt(bfa.aEntregar)}</td>
      <td class="num-cell">${fmt(rep.entregaBfa.cash)}</td>
      <td class="num-cell">${fmt(rep.entregaBfa.tpa)}</td>
      <td class="num-cell">${fmt(rep.entregaBfa.transferencia)}</td>
      <td class="num-cell">${fmt(rep.entregaBfa.depositoBanco)}</td>
      <td>${bfa.estado==='ok'?'<span class="stamp ok">OK</span>':bfa.estado==='falta'?'<span class="stamp falta">FALTA</span>':'<span class="stamp mais">A MAIS</span>'}</td>
      <td>${cont.bfa && cont.bfa.recebido?'<span class="stamp ok">recebido</span>':'<span class="muted">pendente</span>'}</td>
    </tr>`;
  }).join('');
  document.getElementById('pbfa-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Loja</th><th>Depósitos</th><th>Levantamentos</th><th>Diferença</th><th>Cash</th><th>TPA</th><th>Transf.</th><th>Depósito banco</th><th>Estado BFA</th><th>Contabilidade</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <hr class="divider">
    <div class="kv"><span>Total depósitos (todas as lojas)</span><b>${fmt(totDep)} Kz</b></div>
    <div class="kv"><span>Total levantamentos</span><b>${fmt(totLev)} Kz</b></div>
    <div class="kv"><span>Total diferença a entregar</span><b>${fmt(totDif)} Kz</b></div>
  `;
}
function attachPainelBFAHandlers(){
  document.getElementById('pbfa-date').onchange = loadPainelBFA;
  loadPainelBFA();
}

/* ============================================================
   STOCK — visão em tempo real (funcionário: própria loja; ADM/Supervisor: todas)
============================================================ */
function viewStock(){
  return `<div class="sheet"><h2>Stock</h2><div id="stock-body" class="empty">A carregar…</div></div>`;
}
async function loadStock(){
  const el = document.getElementById('stock-body');
  if(S.session.role==='funcionario'){
    const r = await getLiveStock(S.session.store); // já vem pronto do servidor: {store, base, linhas}
    if(!r || !r.linhas || !r.linhas.length){ el.innerHTML = '<div class="empty">Ainda sem histórico para calcular o stock desta loja.</div>'; return; }
    el.innerHTML = `
      <p class="hint">Stock atual da loja, com base no relatório de ${r.base?r.base.date:'-'}${r.base && r.base.status==='rascunho'?' (rascunho em curso, atualizado ao vivo)':''}.</p>
      <div class="table-scroll"><table>
        <thead><tr><th>Produto</th><th>Stock atual</th><th>Reforços hoje</th></tr></thead>
        <tbody>${r.linhas.map(l=>`<tr><td>${l.nome}<div class="small-note">${l.unidade}</div></td><td class="num-cell">${fmt(l.stock)}</td><td class="num-cell">${l.reforcosHoje}</td></tr>`).join('')}</tbody>
      </table></div>`;
  } else {
    let cruzado = {lojas:[], produtos:[]};
    try{ cruzado = await api('GET','/stock'); }catch(e){ toast(e.message); }
    const { lojas, produtos } = cruzado;
    const tabela = produtos.map(p=>{
      const cells = lojas.map(l=>`<td class="num-cell">${p.porLoja[l]!==null && p.porLoja[l]!==undefined ? fmt(p.porLoja[l]) : '—'}</td>`).join('');
      return `<tr><td>${p.nome}</td>${cells}</tr>`;
    }).join('');
    el.innerHTML = `
      <p class="hint">Stock atual, cruzado entre todas as lojas (tempo real, com base no relatório de hoje ou no último enviado).</p>
      <div class="table-scroll"><table>
        <thead><tr><th>Produto</th>${lojas.map(l=>`<th>${l}</th>`).join('')}</tr></thead>
        <tbody>${tabela || `<tr><td colspan="${lojas.length+1}" class="empty">Sem dados ainda.</td></tr>`}</tbody>
      </table></div>`;
  }
}
function attachStockHandlers(){ loadStock(); }

/* ============================================================
   RESUMO MENSAL (supervisor/admin)
============================================================ */
function viewResumoMensal(){
  return `
  <div class="sheet">
    <h2>Resumo Mensal</h2>
    <div class="field-wrap" style="max-width:220px;"><label class="field">Mês</label><input type="month" id="rm-month" value="${S.selectedMonth}"></div>
    <div id="rm-body" class="empty">A carregar…</div>
  </div>`;
}
async function loadResumoMensal(){
  const month = document.getElementById('rm-month').value;
  S.selectedMonth = month;
  const reps = await listReportsForMonth(month);
  if(!reps.length){ document.getElementById('rm-body').innerHTML='<div class="empty">Sem relatórios neste mês.</div>'; return; }

  // totais por produto
  const porProduto = {}; // nome -> {venda, entrada}
  const porLoja = {};
  const porDia = {};
  let totDepBFA=0, totLevBFA=0, totDifBFA=0;
  let totEntregueBfa=0, totEntregueVendas=0, totSaidasGeral=0;
  reps.forEach(rep=>{
    rep.produtos.forEach(p=>{ calcProduto(p);
      if(!porProduto[p.nome]) porProduto[p.nome] = {venda:0, entrada:0};
      porProduto[p.nome].venda += Number(p.vendaTotalValor||0);
      porProduto[p.nome].entrada += Number(p.entradaTotal||0);
    });
    const totalVendido = rep.produtos.reduce((a,p)=>a+Number(p.vendaTotalValor||0),0);
    porLoja[rep.store] = (porLoja[rep.store]||0) + totalVendido;
    porDia[rep.date] = (porDia[rep.date]||0) + totalVendido;
    const bfa = bfaEntregaStatus(rep);
    const vendasSt = vendasEntregaStatus(rep);
    totDepBFA += Number(rep.bfa.depositos||0);
    totLevBFA += Number(rep.bfa.levantamentos||0);
    totDifBFA += bfa.aEntregar;
    totEntregueBfa += bfa.totalEntregue;
    totEntregueVendas += vendasSt.totalEntregue;
    totSaidasGeral += totalSaidasRep(rep);
  });
  const rankingProdutos = Object.entries(porProduto).sort((a,b)=>b[1].venda-a[1].venda);
  const rankingLojas = Object.entries(porLoja).sort((a,b)=>b[1]-a[1]);
  const dias = Object.keys(porDia).sort();
  const maxDia = Math.max(...dias.map(d=>porDia[d]),1);

  const barChart = `
    <svg viewBox="0 0 ${dias.length*26} 140" style="width:100%;height:140px;">
      ${dias.map((d,i)=>{
        const h = (porDia[d]/maxDia)*110;
        return `<rect x="${i*26+4}" y="${130-h}" width="16" height="${h}" fill="#2F6B4F"></rect>`;
      }).join('')}
    </svg>
    <div style="display:flex;font-size:9px;color:var(--ink-soft);">
      ${dias.map(d=>`<div style="width:26px;text-align:center;">${d.slice(8,10)}</div>`).join('')}
    </div>`;

  document.getElementById('rm-body').innerHTML = `
    <div class="section-label">Vendas diárias — ${month}</div>
    ${barChart}
    <div class="kv"><span>Total vendido no mês</span><b>${fmt(rankingLojas.reduce((a,[,v])=>a+v,0))} Kz</b></div>
    <div class="kv"><span>Total de saídas no mês</span><b>${fmt(totSaidasGeral)} Kz</b></div>
    <div class="kv"><span>Total entregue (BFA)</span><b>${fmt(totEntregueBfa)} Kz</b></div>
    <div class="kv"><span>Total entregue (Vendas)</span><b>${fmt(totEntregueVendas)} Kz</b></div>
    <div class="section-label">Resumo por produto (entrada e venda do mês)</div>
    <div class="table-scroll"><table><thead><tr><th>Produto</th><th>Entrada total</th><th>Venda total</th></tr></thead>
      <tbody>${rankingProdutos.map(([n,v])=>`<tr><td>${n}</td><td class="num-cell">${fmt(v.entrada)} Kz</td><td class="num-cell">${fmt(v.venda)} Kz</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="section-label">Comparação entre lojas</div>
    <div class="table-scroll"><table><thead><tr><th>Loja</th><th>Total vendido no mês</th></tr></thead>
      <tbody>${rankingLojas.map(([n,v])=>`<tr><td>${n}</td><td class="num-cell">${fmt(v)} Kz</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="section-label">BFA do mês (todas as lojas)</div>
    <div class="kv"><span>Total depósitos</span><b>${fmt(totDepBFA)} Kz</b></div>
    <div class="kv"><span>Total levantamentos</span><b>${fmt(totLevBFA)} Kz</b></div>
    <div class="kv"><span>Total diferença a entregar</span><b>${fmt(totDifBFA)} Kz</b></div>
    <button class="ghost small" id="export-csv" style="margin-top:12px;">Exportar CSV do mês</button>
    ${S.session.role==='admin' ? `
      <div class="section-label">Fecho de mês</div>
      <div id="fecho-mes-area"><p class="muted">A verificar…</p></div>
    ` : ''}
  `;
  document.getElementById('export-csv').onclick = ()=>{
    let csv = 'Loja,Data,Produto,Entrada,Venda,Resto\n';
    reps.forEach(rep=>rep.produtos.forEach(p=>{
      csv += `${rep.store},${rep.date},${p.nome},${p.entradaTotal},${p.vendaTotalValor},${p.resto}\n`;
    }));
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `resumo-${month}.csv`; a.click();
  };
  if(S.session.role==='admin'){
    try{
      const fechados = await api('GET','/reports/closed-months');
      const info = fechados.find(f=>f.month===month);
      const area = document.getElementById('fecho-mes-area');
      if(info){
        area.innerHTML = `<div class="banner ok">Mês fechado por ${info.closed_by} em ${new Date(info.closed_at).toLocaleDateString('pt-PT')}. Nenhum relatório deste mês pode mais ser editado.</div>`;
      } else {
        area.innerHTML = `
          <p class="hint">Depois de fechado, nenhum relatório de ${month} pode voltar a ser editado, nem com aprovação. Confirma que todas as lojas já lançaram e a contabilidade já confirmou antes de fechar.</p>
          <button class="danger small" id="fechar-mes-btn">Fechar ${month} definitivamente</button>`;
        document.getElementById('fechar-mes-btn').onclick = async ()=>{
          if(!confirm(`Tens a certeza? Fechar ${month} é definitivo — ninguém, nem o ADM, poderá voltar a editar relatórios desse mês.`)) return;
          try{
            await api('POST','/reports/close-month', {month});
            toast('Mês fechado.');
            loadResumoMensal();
          }catch(e){ toast(e.message); }
        };
      }
    }catch(e){ /* silencioso: fecho de mês é um extra, não bloqueia o resto do ecrã */ }
  }
}
function attachResumoMensalHandlers(){
  document.getElementById('rm-month').onchange = loadResumoMensal;
  loadResumoMensal();
}

   UTILIZADORES (admin)

function viewUtilizadores(){
  return `<div class="sheet"><h2>Utilizadores</h2><div id="users-body" class="empty">A carregar…</div></div>`;
}
async function loadUtilizadores(){
  await loadUsers();
  const rows = S.users.map(u=>`
    <tr>
      <td>${u.username}</td>
      <td><span class="badge role-${u.role}">${ROLE_LABELS[u.role]}</span></td>
      <td>${u.store||'—'}</td>
      <td>${u.mustChangePassword?'<span class="badge">deve trocar password</span>':''}</td>
      <td style="text-align:right;">${u.username!==S.session.username?`<button class="ghost small" data-del-user="${u.username}">Remover</button>`:''}</td>
    </tr>`).join('');
  document.getElementById('users-body').innerHTML = `
    <div class="table-scroll"><table>
      <thead><tr><th>Utilizador</th><th>Papel</th><th>Loja</th><th></th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <hr class="divider">
    <div class="section-label">Criar novo utilizador</div>
    <div class="row4">
      <div class="field-wrap"><label class="field">Utilizador</label><input type="text" id="uu-name"></div>
      <div class="field-wrap"><label class="field">Password provisória</label><input type="text" id="uu-pass" value="mudar123"></div>
      <div class="field-wrap"><label class="field">Papel</label>
        <select id="uu-role">
          <option value="funcionario">Funcionário (loja)</option>
          <option value="contabilista">Contabilista</option>
          <option value="supervisor">Supervisor</option>
          <option value="admin">ADM</option>
        </select>
      </div>
      <div class="field-wrap"><label class="field">Nome da loja (se funcionário)</label><input type="text" id="uu-store"></div>
    </div>
    <button id="add-user-btn">Criar utilizador</button>
    <p class="small-note">O utilizador é obrigado a trocar a password no primeiro acesso.</p>
  `;
  document.getElementById('add-user-btn').onclick = async ()=>{
    const username = document.getElementById('uu-name').value.trim();
    const password = document.getElementById('uu-pass').value;
    const role = document.getElementById('uu-role').value;
    const store = document.getElementById('uu-store').value.trim();
    if(!username || !password){ toast('Preenche utilizador e password.'); return; }
    if(role==='funcionario' && !store){ toast('Indica o nome da loja.'); return; }
    try{
      await api('POST','/users', {username, password, role, store: role==='funcionario'?store:null});
      toast('Utilizador criado.');
      loadUtilizadores();
    }catch(e){ toast(e.message); }
  };
  document.querySelectorAll('[data-del-user]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Remover este utilizador?')) return;
      try{
        await api('DELETE', `/users/${b.getAttribute('data-del-user')}`);
        loadUtilizadores();
      }catch(e){ toast(e.message); }
    };
  });
}
function attachUtilizadoresHandlers(){ loadUtilizadores(); }
</script>
